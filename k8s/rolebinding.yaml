apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubernetes-mcp-server-readonly
subjects:
  - kind: ServiceAccount
    name: kubernetes-mcp-server
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubernetes-mcp-server-readonly

# If you switch to write access, update `roleRef.name` to `kubernetes-mcp-server-write`.
