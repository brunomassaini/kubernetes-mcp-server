apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-mcp-server
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubernetes-mcp-server
  template:
    metadata:
      labels:
        app: kubernetes-mcp-server
    spec:
      serviceAccountName: kubernetes-mcp-server
      containers:
        - name: server
          image: brunomassaini/kubernetes-mcp-server:latest # replace with your published image
          args:
            - "--port"
            - "8080"
            - "--read-only" # keeps operations non-destructive
          ports:
            - containerPort: 8080
          # If you publish metrics, you can also expose /metrics via a ServiceMonitor.
          # If you later need external kubeconfig for other clusters, mount it here and add --kubeconfig.
